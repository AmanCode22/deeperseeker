name: Release image

# P0-2: a tag push builds and publishes the multi-arch image to ghcr.io and
# prints the digest. Installs inside the image come from uv.lock only (uv
# sync in the Dockerfile) — no unpinned dependency is evaluated at build time.
#
# Tag scheme (one sentence in README): every `v*` tag publishes
#   ghcr.io/<owner>/<repo>:<full version>   e.g. v1.0.0
#   ghcr.io/<owner>/<repo>:<major>          e.g. v1
#   ghcr.io/<owner>/<repo>:latest
on:
  push:
    tags:
      - "v*"
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tag scheme (semver + major + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEEPSEEKER_BUILD_COMMIT=${{ github.sha }}

      - name: Print the digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
