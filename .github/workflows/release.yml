name: Release image

# Images are built ONLY by this workflow — never locally, never by hand.
# A release is: bump [project] version in pyproject.toml, push the matching
# v<version> tag; this yaml does the rest on GitHub's runners.
#
# The version has ONE source: pyproject.toml [project] version (e.g. "6.0").
# The workflow refuses to build when the pushed tag disagrees with it, then
# publishes one multi-arch image (amd64 + arm64) under three tags:
#   ghcr.io/<owner>/<repo>:<version>   e.g. 6.0   (full version)
#   ghcr.io/<owner>/<repo>:<major>     e.g. 6     (major line)
#   ghcr.io/<owner>/<repo>:latest
#
# Installs inside the image come from uv.lock only (uv sync in the
# Dockerfile) — no unpinned dependency is evaluated at build time.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read the version from pyproject.toml (single source of truth)
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the [project] version from pyproject.toml — the release version must live there, not in the tag alone."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}. Tag the release v${VERSION} (or fix pyproject.toml) — never build a mislabeled image."
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          echo "Releasing ${GITHUB_REF_NAME} -> image tags: ${VERSION}, ${MAJOR}, latest"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags from the pyproject.toml version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEEPSEEKER_BUILD_COMMIT=${{ github.sha }}

      - name: Print the digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
