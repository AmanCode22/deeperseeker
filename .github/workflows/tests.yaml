name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ruff-pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  
      - name: Install uv
        uses:  astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies [dev] using uv
        run: uv sync --extra dev --extra tests
      - name: Run Pytest
        run: .venv/bin/pytest
      - name: Run ruff check
        run: .venv/bin/ruff check
