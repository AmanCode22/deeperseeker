services:
  deeperseeker:
    build: .
    container_name: deeperseeker
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - HOST=0.0.0.0
      # P0-8: the image REFUSES to boot with the default admin/admin
      # credentials (it cannot see your host port mapping, so an in-container
      # 0.0.0.0 bind is treated as exposed). Set a real password in .env or
      # in your shell environment before `docker compose up` — see README
      # "Security defaults". DEEPSEEKER_ALLOW_DEFAULT_ADMIN=1 overrides, not
      # recommended.
      - DEEPSEEKER_ADMIN_USER=${DEEPSEEKER_ADMIN_USER:-admin}
      - DEEPSEEKER_ADMIN_PASSWORD=${DEEPSEEKER_ADMIN_PASSWORD:?Set DEEPSEEKER_ADMIN_PASSWORD in .env (P0-8 refuses default credentials on exposed binds)}
    env_file:
      - path: .env
        required: false
    volumes:
      - deeperseeker_data:/app/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  deeperseeker_data:
