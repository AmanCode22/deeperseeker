services:
  deeperseeker:
    build: .
    container_name: deeperseeker
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - deeperseeker_db:/app/deeperseeker.db
      - deeperseeker_cookies:/app/aws_cookies_deepseek.json
    restart: unless-stopped

volumes:
  deeperseeker_db:
  deeperseeker_cookies:
